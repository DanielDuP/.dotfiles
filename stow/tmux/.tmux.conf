
# Enable mouse support
set -g mouse on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Fix colors for Neovim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Reduce escape-time (helps with Neovim)
set -sg escape-time 10

# Focus events (for Neovim autoread)
set -g focus-events on

# Enable passthrough (for image.nvim)
set -g allow-passthrough on

# Session Management Keybindings
bind C-s choose-tree -Zs
bind C-n command-prompt -p "New Session:" "new-session -s '%%'"

# Fuzzy session switcher with fzf
bind C-j display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse --header 'Select session:' | xargs tmux switch-client -t"

# Tmux Plugin Manager (TPM) Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'