
# Enable mouse support
set -g mouse on

# Start window and pane numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reload config
bind C-\; source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Fix colors for Neovim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Reduce escape-time (helps with Neovim)
set -sg escape-time 10

# Focus events (for Neovim autoread)
set -g focus-events on

# Enable passthrough (for image.nvim)
set -g allow-passthrough on

# Session Management Keybindings
bind C-s choose-tree -Zs
bind C-n command-prompt -p "New Session:" "new-session -s '%%' -c '#{pane_current_path}'"
bind C-k confirm-before -p "Kill session #S and switch to next? (y/n)" "switch-client -n \; kill-session -t '=#S'"

# Window Management Keybindings
bind C-c command-prompt -p "New Window:" "new-window -n '%%'"

# Fuzzy session switcher with fzf
bind C-j display-popup -E "tmux list-sessions -F '#{session_name}' | grep -v '^wt/' | grep -v '^rv/' | grep -v '^todo' | grep -v '^notes' | fzf --reverse --header 'Select session:' | xargs tmux switch-client -t"

# Todo popups (y=local, Y=global)
bind y run-shell 'dir="#{pane_current_path}"; name="todo/$(basename "$dir")"; tmux display-popup -E -w 80% -h 80% "tmux attach-session -t \"$name\" 2>/dev/null || tmux new-session -s \"$name\" \"nvim $dir/.todo.md\""'
bind Y display-popup -E -w 80% -h 80% "tmux attach-session -t todo || tmux new-session -s todo 'nvim ~/todo.md'"

# Notes popups (j=local, J=global)
bind j run-shell 'dir="#{pane_current_path}"; name="notes/$(basename "$dir")"; tmux display-popup -E -w 80% -h 80% "tmux attach-session -t \"$name\" 2>/dev/null || tmux new-session -s \"$name\" \"nvim $dir/.notes.md\""'
bind J display-popup -E -w 80% -h 80% "tmux attach-session -t notes || tmux new-session -s notes 'nvim ~/notes.md'"

# Open current branch's PR in browser
bind P run-shell 'cd "#{pane_current_path}" && gh pr view --web 2>/dev/null || tmux display-message "No PR found for this branch"'

# Quick AI chat popup
bind a display-popup -E -w 90% -h 90% "tmux attach-session -t ai || tmux new-session -s ai -c ~/chats 'opencode'"

# Worktree session picker with agent pane preview
bind w display-popup -E -w 80% -h 80% "~/.tmux/scripts/wt-picker.sh"

# Refresh cached PR status for the session being switched to (background).
set-hook -g client-session-changed 'run-shell -b "~/.tmux/scripts/wt-pr-refresh.sh #{session_name}"'

# Create new worktree session
bind W command-prompt -p "task name:" \
  "run-shell 'cd \"#{pane_current_path}\" && zsh -c \"source ~/.config/zsh/functions/wt.zsh && wt new %1\"'"

# Review session picker with delta diff preview
bind r display-popup -E -w 80% -h 80% "\
  tmux list-sessions -F '#{session_last_attached} #{session_name}' | \
  grep ' rv/' | sort -rn | awk '{print \$2}' | \
  fzf --ansi --reverse --header 'Review sessions:' \
      --preview 'p=\$(tmux display-message -t {}:shell -p \"#{pane_current_path}\" 2>/dev/null) && \
        echo \"branch: \$(git -C \$p branch --show-current 2>/dev/null)\" && \
        echo \"\" && \
        base=\$(git -C \$p symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed \"s|refs/remotes/origin/||\" || echo main) && \
        git -C \$p diff \$base...HEAD --stat 2>/dev/null && \
        echo \"\" && \
        git -C \$p diff \$base...HEAD 2>/dev/null | delta --paging=never --line-numbers --width=\${FZF_PREVIEW_COLUMNS:-80}' \
      --preview-window=right:60% | \
  xargs -I{} tmux switch-client -t {}"

# Create new review session
bind R command-prompt -p "branch name:,agent (claude/opencode):" \
  "run-shell 'cd \"#{pane_current_path}\" && zsh -c \"source ~/.config/zsh/functions/rv.zsh && rv new %1 --agent %2\"'"

# Kanagawa theme colors
set -g status-style "bg=#1f1f28,fg=#dcd7ba"
set -g status-left "#[bg=#7e9cd8,fg=#1f1f28,bold] #S #[bg=#1f1f28] "
set -g status-right "#[fg=#727169]%H:%M #[fg=#7e9cd8]%d-%b"
set -g status-left-length 30
set -g window-status-format "#[fg=#727169] #I:#W "
set -g window-status-current-format "#[fg=#7e9cd8,bold] #I:#W "
set -g pane-border-style "fg=#727169"
set -g pane-active-border-style "fg=#7e9cd8"
set -g message-style "bg=#2d4f67,fg=#dcd7ba"

# Tmux Plugin Manager (TPM) Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-hook-post-save-layout 'sed -i "" -E "/^[a-z]+\t(todo|notes)(\/[^\t]*)?\t/d" $1'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'